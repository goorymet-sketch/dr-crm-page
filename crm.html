<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Reach CRM — مبيعات · وساطة · ميزانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--navy2:#13294b;--gold:#f2b705;--teal:#14b8a6;--red:#ef4444;--bg:#f4f6fb;--card:#fff;--muted:#64748b;--line:#e2e8f0;--green:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:#0f172a}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0;font-weight:800}
header h1 span{color:var(--gold)}
#sync{font-size:12px;padding:3px 10px;border-radius:20px;background:#ffffff22}
header .sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--navy2)}
nav button{flex:0 0 auto;border:0;background:#ffffff14;color:#fff;padding:8px 14px;border-radius:10px;font:600 14px Cairo;cursor:pointer}
nav button.on{background:var(--gold);color:var(--navy)}
nav .cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-right:4px}
main{max-width:1100px;margin:0 auto;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row input,.row select{flex:1;min-width:140px}
input,select,textarea{font:14px Cairo;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
textarea{min-height:70px}
.btn{text-decoration:none;display:inline-block;border:0;border-radius:10px;padding:9px 14px;font:700 14px Cairo;cursor:pointer;background:var(--navy);color:#fff;white-space:nowrap}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:#fee2e2;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.wa{background:#25d366;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px;border-right:5px solid var(--teal);box-shadow:0 1px 3px #0001}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat small{color:var(--muted)}
.stat.warn{border-color:var(--red)}.stat.gold{border-color:var(--gold)}.stat.navy{border-color:var(--navy)}
.list{display:grid;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px #0001;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card .info{flex:1;min-width:200px}
.card .t{font-weight:800;font-size:15px}
.card .s{color:var(--muted);font-size:13px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card.click{cursor:pointer}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;background:#e0f2fe;color:#075985;margin-left:6px;font-weight:700}
.badge.won{background:#dcfce7;color:#166534}.badge.lost{background:#fee2e2;color:#991b1b}.badge.k{background:#fef3c7;color:#92400e}.badge.co{background:#ede9fe;color:#5b21b6}
.due{font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px}
.due.late{background:#fee2e2;color:#b91c1c}.due.today{background:#fef3c7;color:#92400e}.due.next{background:#e0f2fe;color:#075985}
h2{font-size:17px;margin:18px 0 8px;color:var(--navy)}
.empty{text-align:center;color:var(--muted);padding:24px;background:#fff;border-radius:14px}
.box{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
.in{color:var(--green);font-weight:800}.out{color:var(--red);font-weight:800}
.bar{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal)}
.step{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.step .tx{flex:1;min-width:180px}
.step.done .tx{text-decoration:line-through;color:var(--muted)}
.prev{overflow:auto;max-height:220px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.prev table{border-collapse:collapse;font-size:12px;width:100%}
.prev td,.prev th{border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap;text-align:right}
.prev th{background:#f8fafc}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 10px}
#modal .m{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px}
#modal label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--navy)}
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#login .m{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:380px}
#login h3{margin:0 0 6px;color:var(--navy)}
#login p{color:var(--muted);font-size:13px;margin:0 0 12px}
#login input{margin-bottom:10px}
#loginErr{color:var(--red);font-size:13px;min-height:18px}
.hidden{display:none!important}
@media(max-width:600px){header h1{font-size:16px}.card .acts{width:100%}}
</style>
</head>
<body>

<div id="login">
  <div class="m">
    <h3>Digital Reach CRM</h3>
    <p>ادخل بنفس إيميل وباسورد الـ CRM القديم علشان الداتا تتحفظ أونلاين وتظهر على أي جهاز.</p>
    <input id="lEmail" type="email" placeholder="الإيميل" autocomplete="username">
    <input id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <div id="loginErr"></div>
    <button class="btn gold" style="width:100%" onclick="doLogin()">دخول</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="useOffline()">اشتغل على الجهاز ده بس (من غير أونلاين)</button>
  </div>
</div>

<header>
  <h1>Digital Reach <span>CRM</span></h1>
  <span id="sync">محلي</span>
  <div class="sp"></div>
  <button class="btn gold sm" onclick="quickAdd()">+ إضافة</button>
  <button class="btn ghost sm" onclick="openImport(curCo||'')">⬆ رفع أرقام</button>
  <button class="btn ghost sm" onclick="doLogout()">خروج</button>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<div id="modal"><div class="m" id="mbody"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
/* ================== الإعدادات ================== */
var firebaseConfig={
  apiKey:"AIzaSyDhZKeWe1ytVMt6Vlm4JExESk9kXq3RFeg",
  authDomain:"digitalreach-crm.firebaseapp.com",
  projectId:"digitalreach-crm",
  storageBucket:"digitalreach-crm.firebasestorage.app",
  messagingSenderId:"633336135091",
  appId:"1:633336135091:web:de8f20b2fa143ae6665fc6"
};
// ملف داتا منفصل: crmData/simple (مش بيلمس main ولا jisr)
var DOC_PATH=['crmData','simple'];
var KEY='dr_simple_crm_v1';

var STAGES_SALES=['جديد','تم التواصل','مهتم','عرض سعر','تم البيع','خسارة'];
var STAGES_BROKER=['جديد','تفاوض أسعار','أسعار متاحة','عرض لشركة','حجز مؤكد','عمولة محصلة','مرفوض'];
var WON=['تم البيع','حجز مؤكد','عمولة محصلة'], LOST=['خسارة','مرفوض'];

var SCHEMA={
  companies:{title:'الشركات',name:'شركة',fields:[
    {k:'name',l:'اسم الشركة',req:1},
    {k:'contact',l:'اسم المسؤول'},
    {k:'phone',l:'رقم الواتساب',t:'tel'},
    {k:'industry',l:'المجال (سياحة، عمرة، عقارات...)'},
    {k:'deal',l:'الاتفاق (عمولة / نسبة / مبلغ ثابت)'},
    {k:'goal',l:'الهدف (مثلاً: 20 معتمر في رجب)'},
    {k:'followUp',l:'موعد المتابعة الجاية',t:'datetime-local'},
    {k:'note',l:'ملاحظات',t:'textarea'}]},
  sales:{title:'المبيعات',name:'عميل',fields:[
    {k:'companyId',l:'تابع لشركة',t:'company'},
    {k:'name',l:'اسم العميل',req:1},
    {k:'company',l:'شركة / جهة العميل'},
    {k:'phone',l:'رقم الواتساب',t:'tel'},
    {k:'stage',l:'المرحلة',t:'select',o:STAGES_SALES},
    {k:'value',l:'قيمة الصفقة',t:'number'},
    {k:'source',l:'المصدر (إعلان، ترشيح، واتساب، ملف...)'},
    {k:'followUp',l:'موعد المتابعة الجاية',t:'datetime-local'},
    {k:'note',l:'ملاحظات',t:'textarea'}]},
  broker:{title:'الوساطة',name:'جهة / صفقة',fields:[
    {k:'kind',l:'النوع',t:'select',o:['فندق','شركة سياحة','صفقة']},
    {k:'name',l:'الاسم (فندق / شركة / وصف الصفقة)',req:1},
    {k:'contact',l:'اسم المسؤول'},
    {k:'phone',l:'رقم الواتساب',t:'tel'},
    {k:'city',l:'المنطقة'},
    {k:'stage',l:'المرحلة',t:'select',o:STAGES_BROKER},
    {k:'rate',l:'سعر الليلة / الجروب',t:'number'},
    {k:'rooms',l:'عدد الغرف / الأفراد',t:'number'},
    {k:'commission',l:'العمولة المتوقعة',t:'number'},
    {k:'followUp',l:'موعد المتابعة الجاية',t:'datetime-local'},
    {k:'note',l:'ملاحظات',t:'textarea'}]},
  money:{title:'الميزانية',name:'حركة فلوس',fields:[
    {k:'type',l:'النوع',t:'select',o:['دخل','مصروف']},
    {k:'amount',l:'المبلغ',t:'number',req:1},
    {k:'category',l:'البند (عمولة، إعلان، مواصلات...)'},
    {k:'section',l:'تابع لـ',t:'select',o:['عام','مبيعات','وساطة']},
    {k:'companyId',l:'الشركة (اختياري)',t:'company'},
    {k:'date',l:'التاريخ',t:'date'},
    {k:'note',l:'ملاحظات',t:'textarea'}]},
  tasks:{title:'مهمة متابعة',name:'مهمة',fields:[
    {k:'title',l:'المطلوب',req:1},
    {k:'phone',l:'رقم واتساب (اختياري)',t:'tel'},
    {k:'followUp',l:'الميعاد',t:'datetime-local',req:1},
    {k:'note',l:'ملاحظات',t:'textarea'}]}
};

/* ================== الداتا ================== */
function emptyDb(){return {companies:[],sales:[],broker:[],money:[],tasks:[],settings:{waMsg:'أهلاً {name}، معاك محمد طارق من Digital Reach.'}}}
var db=emptyDb();
try{var s=localStorage.getItem(KEY); if(s){db=Object.assign(emptyDb(),JSON.parse(s));}}catch(e){}
var tab='dash', q='', fStage='', curCo='';
var fb=null, cloudDoc=null, online=false, unsub=null, saveTimer=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){v=parseFloat(v);return isNaN(v)?0:v}
function money(v){return num(v).toLocaleString('en-US')}
function setSync(t,c){var el=document.getElementById('sync');el.textContent=t;el.style.background=c||'#ffffff22'}
function co(id){return db.companies.find(function(c){return c.id===id})}
function coName(id){var c=co(id);return c?c.name:''}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
  if(online&&cloudDoc){
    setSync('جاري الحفظ...','#f2b70555');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      var data=JSON.parse(JSON.stringify(db));
      data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
      cloudDoc.set(data).then(function(){setSync('محفوظ أونلاين ✓','#14b8a655')})
      .catch(function(e){setSync('فشل الحفظ أونلاين — محفوظ على الجهاز','#ef444477');console.error(e)});
    },700);
  }else setSync('محفوظ على الجهاز');
}

/* ================== Firebase ================== */
function initFirebase(){try{
  firebase.initializeApp(firebaseConfig);
  fb={auth:firebase.auth(),fs:firebase.firestore()};
  cloudDoc=fb.fs.collection(DOC_PATH[0]).doc(DOC_PATH[1]);
  fb.auth.onAuthStateChanged(function(u){
    if(u){hideLogin();connectCloud();}
    else{online=false;if(unsub){unsub();unsub=null}
      if(localStorage.getItem(KEY+'_offline')==='1')hideLogin();else showLogin();}
  });
}catch(e){console.error(e);hideLogin();setSync('Firebase مش متاح — محلي');}}

function connectCloud(){
  setSync('جاري الاتصال...');
  var first=true;
  unsub=cloudDoc.onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){
      var d=snap.data(); delete d.updatedAt;
      db=Object.assign(emptyDb(),d);
      try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
      online=true; setSync('متزامن أونلاين ✓','#14b8a655');
      var btz='';try{btz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(x){}
      if(btz&&db.settings.tz!==btz){db.settings.tz=btz;save();}
      if(document.getElementById('modal').style.display!=='flex')render();
    }else if(first){
      online=true; save();
    }
    first=false;
  },function(err){
    online=false; console.error(err);
    setSync(err.code==='permission-denied'?'Firebase رافض الصلاحية — محلي':'مش متصل — محلي','#ef444477');
  });
}
function doLogin(){
  var e=document.getElementById('lEmail').value.trim(),p=document.getElementById('lPass').value;
  var er=document.getElementById('loginErr'); er.textContent='';
  if(!fb){er.textContent='Firebase مش متاح.';return}
  fb.auth.signInWithEmailAndPassword(e,p).catch(function(err){
    er.textContent=err.code==='auth/invalid-credential'?'الإيميل أو كلمة المرور غلط.':
      err.code==='auth/unauthorized-domain'?'الدومين مش مضاف في Firebase Authentication.':('خطأ: '+err.message);
  });
}
function useOffline(){localStorage.setItem(KEY+'_offline','1');hideLogin();}
function doLogout(){localStorage.removeItem(KEY+'_offline');if(fb&&fb.auth.currentUser)fb.auth.signOut();else showLogin();}
function showLogin(){document.getElementById('login').classList.remove('hidden')}
function hideLogin(){document.getElementById('login').classList.add('hidden');render()}

/* ================== واتساب وكالندر ================== */
function waNumber(p){
  p=String(p||'').replace(/\D/g,'');
  if(p.indexOf('00')===0)p=p.slice(2);
  if(/^01[0125]\d{8}$/.test(p))p='2'+p;               // مصر 01xxxxxxxxx
  else if(/^1[0125]\d{8}$/.test(p))p='20'+p;           // مصر من غير الصفر (من الإكسل)
  else if(/^05\d{8}$/.test(p))p='966'+p.slice(1);      // السعودية 05xxxxxxxx
  else if(/^5\d{8}$/.test(p))p='966'+p;                // السعودية من غير الصفر
  return p;
}
function waLink(phone,name){
  var msg=(db.settings.waMsg||'').replace(/\{name\}/g,name||'');
  return 'https://wa.me/'+waNumber(phone)+'?text='+encodeURIComponent(msg);
}
function pad(n){return (n<10?'0':'')+n}
function gcalFmt(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'}
function gcalLink(title,details,dt){
  var d=new Date(dt); if(isNaN(d))return '#';
  var e=new Date(d.getTime()+30*60000);
  var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(x){}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+gcalFmt(d)+'/'+gcalFmt(e)+'&details='+encodeURIComponent(details||'')+(tz?'&ctz='+encodeURIComponent(tz):'');
}
function dueInfo(dt){
  if(!dt)return null; var d=new Date(dt); if(isNaN(d))return null;
  var now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()), t1=new Date(t0.getTime()+86400000);
  var txt=d.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'})+(dt.length>10?' '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}):'');
  if(d<now&&d>=t0)return {c:'today',l:'النهارده '+txt};
  if(d<t0)return {c:'late',l:'متأخر: '+txt};
  if(d<t1)return {c:'today',l:'النهارده '+txt};
  return {c:'next',l:txt};
}
function toLocalDT(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}

/* ================== المتابعة (تجميع) ================== */
function followUps(){
  var out=[];
  db.companies.forEach(function(c){
    if(c.followUp)out.push({sec:'companies',x:c,title:c.name,tag:'شركة'});
    (c.plan||[]).forEach(function(p){if(p.due&&!p.done)out.push({sec:'plan',x:{id:c.id+'|'+p.id,followUp:p.due,phone:'',note:''},title:p.text,tag:'خطة '+c.name})});
  });
  db.sales.forEach(function(x){if(x.followUp)out.push({sec:'sales',x:x,title:x.name+(x.companyId?' — '+coName(x.companyId):(x.company?' — '+x.company:'')),tag:'مبيعات'})});
  db.broker.forEach(function(x){if(x.followUp)out.push({sec:'broker',x:x,title:x.name+(x.contact?' — '+x.contact:''),tag:'وساطة'})});
  db.tasks.forEach(function(x){if(x.followUp&&!x.done)out.push({sec:'tasks',x:x,title:x.title,tag:'مهمة'})});
  out.sort(function(a,b){return new Date(a.x.followUp)-new Date(b.x.followUp)});
  return out;
}
function overdueCount(){var n=0,t1=new Date();t1.setHours(23,59,59);followUps().forEach(function(f){if(new Date(f.x.followUp)<=t1)n++});return n}

/* ================== العرض ================== */
var TABS=[['dash','الرئيسية'],['follow','المتابعة'],['companies','الشركات'],['sales','المبيعات'],['broker','الوساطة'],['money','الميزانية'],['settings','إعدادات']];
function render(){
  var c=overdueCount(),act=tab==='company'?'companies':tab;
  document.getElementById('nav').innerHTML=TABS.map(function(t){
    return '<button class="'+(act===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+(t[0]==='follow'&&c?'<span class="cnt">'+c+'</span>':'')+'</button>'}).join('');
  if(tab==='company'&&!co(curCo))tab='companies';
  document.getElementById('view').innerHTML=({dash:vDash,follow:vFollow,companies:vCompanies,company:vCompany,sales:vSec,broker:vSec,money:vMoney,settings:vSettings})[tab]();
}
function go(t){tab=t;q='';fStage='';if(t!=='company')curCo='';render();window.scrollTo(0,0)}
function openCo(id){curCo=id;tab='company';render();window.scrollTo(0,0)}

function monthNet(){
  var n=new Date(),key=n.getFullYear()+'-'+pad(n.getMonth()+1),i=0,o=0;
  db.money.forEach(function(m){if((m.date||'').indexOf(key)===0){if(m.type==='مصروف')o+=num(m.amount);else i+=num(m.amount)}});
  return {i:i,o:o};
}
function vDash(){
  var fu=followUps(),od=overdueCount();
  var pipe=db.sales.filter(function(x){return WON.indexOf(x.stage)<0&&LOST.indexOf(x.stage)<0}).reduce(function(a,x){return a+num(x.value)},0);
  var won=db.sales.filter(function(x){return x.stage==='تم البيع'}).reduce(function(a,x){return a+num(x.value)},0);
  var bAct=db.broker.filter(function(x){return LOST.indexOf(x.stage)<0&&x.stage!=='عمولة محصلة'});
  var com=bAct.reduce(function(a,x){return a+num(x.commission)},0);
  var mn=monthNet();
  var h='<div class="stats">'+
    st(od,'متابعات النهارده والمتأخرة','warn')+
    st(db.companies.length,'الشركات','navy')+
    st(db.sales.length,'عملاء المبيعات','navy')+
    st(money(pipe),'صفقات مفتوحة (قيمة)','gold')+
    st(money(won),'مبيعات تمت','')+
    st(bAct.length,'جهات وساطة نشطة','navy')+
    st(money(com),'عمولات متوقعة','gold')+

function coStats(c){
  var leads=db.sales.filter(function(x){return x.companyId===c.id});
  var won=leads.filter(function(x){return x.stage==='تم البيع'});
  var plan=c.plan||[],done=plan.filter(function(p){return p.done}).length;
  var inc=db.money.filter(function(m){return m.companyId===c.id&&m.type!=='مصروف'}).reduce(function(a,m){return a+num(m.amount)},0);
  var exp=db.money.filter(function(m){return m.companyId===c.id&&m.type==='مصروف'}).reduce(function(a,m){return a+num(m.amount)},0);
  return {leads:leads,won:won,plan:plan,done:done,pct:plan.length?Math.round(done*100/plan.length):0,inc:inc,exp:exp,
    wonVal:won.reduce(function(a,x){return a+num(x.value)},0)};
}

    '<div class="row" style="margin-top:8px"><button class="btn" onclick="exportJson()">تنزيل نسخة JSON</button><button class="btn ghost" onclick="exportCsv()">تنزيل العملاء Excel (CSV)</button>'+
    '<label class="btn ghost">استيراد نسخة JSON<input type="file" accept=".json" class="hidden" onchange="importJson(this)"></label></div></div>'+
    '<div class="box"><b>الحالة</b><div style="font-size:13px">'+(online?'متصل بـ Firebase — الداتا بتتحفظ أونلاين في crmData/simple':'شغال على الجهاز ده بس. سجّل دخول علشان الداتا تتحفظ أونلاين.')+'</div>'+
    '<div style="font-size:13px;color:var(--muted)">الشركات: '+db.companies.length+' · المبيعات: '+db.sales.length+' · الوساطة: '+db.broker.length+' · الفلوس: '+db.money.length+' · المهام: '+db.tasks.length+'</div></div>';
}

/* ================== رفع ملف الأرقام ================== */
var IMP={rows:[],head:[],map:{}};
function openImport(coId){
  document.getElementById('mbody').innerHTML='<h3 style="margin:0;color:var(--navy)">⬆ رفع ملف أرقام</h3>'+
    '<div style="font-size:13px;color:var(--muted);margin-top:6px">ارفع Excel أو CSV (عمود فيه الأرقام، ويفضل عمود للأسماء)، أو الصق الأرقام تحت.</div>'+
    '<label>يتضافوا لـ</label><select id="i_co"><option value="">بدون شركة (مبيعات عامة)</option>'+db.companies.map(function(c){return '<option value="'+c.id+'"'+(c.id===coId?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>'+
    '<label>الملف (xlsx / xls / csv)</label><input type="file" id="i_file" accept=".xlsx,.xls,.csv,.txt" onchange="readImpFile(this)">'+
    '<label>أو الصق هنا (كل عميل في سطر: اسم ورقم، أو رقم بس)</label><textarea id="i_paste" placeholder="أحمد محمد 01012345678&#10;01198765432" oninput="readImpPaste()"></textarea>'+
    '<div id="i_map"></div>'+
    '<label>المرحلة</label><select id="i_stage">'+STAGES_SALES.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select>'+
    '<label>المصدر</label><input id="i_src" value="ملف أرقام '+new Date().toISOString().slice(0,10)+'">'+
    '<label><input type="checkbox" id="i_dup" checked style="width:auto"> تجاهل الأرقام المتكررة (الموجودة قبل كده في نفس الشركة)</label>'+
    '<div id="i_msg" style="font-size:13px;margin-top:8px;color:var(--navy);font-weight:700"></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn gold" onclick="doImport()">رفع العملاء</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div>';
  IMP={rows:[],head:[],map:{}};openM();
}
function readImpFile(inp){
  var f=inp.files[0];if(!f)return;var isCsv=/\.(csv|txt)$/i.test(f.name),r=new FileReader();
  r.onload=function(){
    var rows=[];
    try{
      if(window.XLSX){var wb=isCsv?XLSX.read(r.result,{type:'string',raw:true}):XLSX.read(new Uint8Array(r.result),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});}
      else if(isCsv)rows=r.result.split(/\r?\n/).map(function(l){return l.split(/[,;\t]/)});
      else{alert('مكتبة الإكسل ما اتحملتش (النت؟). احفظ الملف CSV وارفعه تاني.');return}
    }catch(e){alert('مقدرتش أقرا الملف: '+e.message);return}
    setImpRows(rows.filter(function(r){return r.some(function(c){return String(c).trim()})}));
  };
  if(isCsv)r.readAsText(f,'UTF-8');else r.readAsArrayBuffer(f);
}
function readImpPaste(){
  var lines=document.getElementById('i_paste').value.split(/\r?\n/).filter(function(l){return l.trim()});
  var rows=lines.map(function(l){
    if(/[\t,;]/.test(l))return l.split(/[\t,;]/).map(function(x){return x.trim()});
    var m=l.match(/(\+?[\d\s\-]{8,})/);var ph=m?m[1].trim():'';var nm=l.replace(ph,'').replace(/[:\-–]+$/,'').trim();
    return [nm,ph];});
  setImpRows([['الاسم','الرقم']].concat(rows));
}
function isPhone(v){var d=String(v||'').replace(/\D/g,'');return d.length>=9&&d.length<=15}
function setImpRows(rows){
  if(!rows.length){document.getElementById('i_map').innerHTML='';IMP.rows=[];return}
  var first=rows[0],hasHead=!first.some(isPhone);
  var head=hasHead?first.map(function(h,i){return String(h||'عمود '+(i+1))}):first.map(function(_,i){return 'عمود '+(i+1)});
  var data=hasHead?rows.slice(1):rows,n=Math.max.apply(null,rows.map(function(r){return r.length}));
  while(head.length<n)head.push('عمود '+(head.length+1));
  function pick(re,fb){for(var i=0;i<head.length;i++)if(re.test(head[i]))return i;return fb}
  var phoneCol=pick(/phone|mobile|tel|whats|رقم|موبايل|تليفون|هاتف|واتس|جوال/i,-1);
  if(phoneCol<0){var best=-1,bc=0;for(var i=0;i<n;i++){var c=data.slice(0,50).filter(function(r){return isPhone(r[i])}).length;if(c>bc){bc=c;best=i}}phoneCol=best}
  var nameCol=pick(/name|اسم|الاسم|العميل/i,-1);
  if(nameCol<0){for(var j=0;j<n;j++)if(j!==phoneCol){nameCol=j;break}}
  IMP={rows:data,head:head,map:{phone:phoneCol,name:nameCol,note:pick(/note|ملاحظ|تفاصيل/i,-1),company:pick(/company|شركة|جهة/i,-1),value:pick(/value|price|amount|قيمة|سعر|مبلغ/i,-1)}};
  function sel(k,l){return '<div style="flex:1;min-width:120px"><label>'+l+'</label><select onchange="IMP.map.'+k+'=+this.value"><option value="-1">—</option>'+head.map(function(h,i){return '<option value="'+i+'"'+(IMP.map[k]===i?' selected':'')+'>'+esc(h)+'</option>'}).join('')+'</select></div>'}
  document.getElementById('i_map').innerHTML='<div style="margin-top:10px;font-weight:700;color:var(--navy)">لقيت '+data.length+' صف — راجع الأعمدة:</div><div class="row" style="margin:0">'+
    sel('phone','عمود الرقم *')+sel('name','عمود الاسم')+sel('company','عمود الجهة')+sel('value','عمود القيمة')+sel('note','عمود الملاحظات')+'</div>'+
    '<div class="prev"><table><tr>'+head.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr>'+data.slice(0,5).map(function(r){return '<tr>'+head.map(function(_,i){return '<td>'+esc(r[i]||'')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
}
function doImport(){
  var m=IMP.map;if(!IMP.rows.length){alert('ارفع ملف أو الصق أرقام الأول');return}
  if(m.phone==null||m.phone<0){alert('اختار عمود الرقم');return}
  var coId=document.getElementById('i_co').value,stage=document.getElementById('i_stage').value,src=document.getElementById('i_src').value,dup=document.getElementById('i_dup').checked;
  var seen={};db.sales.forEach(function(x){if(x.phone&&(x.companyId||'')===coId)seen[waNumber(x.phone)]=1});
  var add=0,skipD=0,skipE=0,now=Date.now();
  IMP.rows.forEach(function(r,i){
    var ph=String(r[m.phone]||'').trim();if(!isPhone(ph)){skipE++;return}
    var key=waNumber(ph);if(dup&&seen[key]){skipD++;return}seen[key]=1;
    function g(k){return m[k]!=null&&m[k]>=0?String(r[m[k]]||'').trim():''}
    db.sales.push({id:uid(),companyId:coId,name:g('name')||ph,company:g('company'),phone:ph,stage:stage,value:g('value').replace(/[^\d.]/g,''),
      source:src,followUp:'',note:g('note'),created:now,updated:now-i});add++;
  });
  if(coId){var c=co(coId);if(c)c.updated=now}
  save();closeM();if(coId)openCo(coId);else go('sales');
  alert('تم رفع '+add+' عميل'+(skipD?' · اتجاهل '+skipD+' رقم متكرر':'')+(skipE?' · '+skipE+' صف من غير رقم صالح':''));
}

/* ================== الفورم ================== */
function openM(){document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function openForm(sec,id,coId){
  var sc=SCHEMA[sec],x=id?db[sec].find(function(i){return i.id===id}):{};
  if(!x)return;
  if(!id){if(sec==='money')x={date:new Date().toISOString().slice(0,10),type:'دخل',section:'عام',companyId:coId||''};
    if(sec==='sales')x={companyId:coId||curCo||''};}
  var h='<h3 style="margin:0;color:var(--navy)">'+(id?'تعديل ':'إضافة ')+sc.name+'</h3>';
  sc.fields.forEach(function(f){
    var v=x[f.k]==null?'':x[f.k];
    h+='<label>'+f.l+(f.req?' *':'')+'</label>';
    if(f.t==='select')h+='<select id="f_'+f.k+'">'+f.o.map(function(o){return '<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
    else if(f.t==='company')h+='<select id="f_'+f.k+'"><option value="">— بدون —</option>'+db.companies.map(function(c){return '<option value="'+c.id+'"'+(v===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>';
    else if(f.t==='textarea')h+='<textarea id="f_'+f.k+'">'+esc(v)+'</textarea>';
    else h+='<input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.t==='number'?' inputmode="decimal"':'')+'>';
  });
  h+='<div class="row" style="margin-top:14px"><button class="btn gold" onclick="saveForm(\''+sec+'\',\''+(id||'')+'\')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div>';
  document.getElementById('mbody').innerHTML=h;openM();
}
function saveForm(sec,id){
  var sc=SCHEMA[sec],o={};
  for(var i=0;i<sc.fields.length;i++){var f=sc.fields[i],v=document.getElementById('f_'+f.k).value.trim();
    if(f.req&&!v){alert('املا خانة: '+f.l);return}o[f.k]=v}
  o.updated=Date.now();
  if(id){var x=db[sec].find(function(i){return i.id===id});Object.assign(x,o)}
  else{o.id=uid();o.created=Date.now();if(sec==='companies')o.plan=[];db[sec].push(o)}
  save();closeM();
  if(sec==='companies'&&!id)openCo(o.id);else render();
  if(o.followUp&&confirm('تحب تضيف ميعاد المتابعة ده لجوجل كالندر علشان يجيلك تنبيه على الموبايل؟')){
    var nm=o.name||o.title||'';window.open(gcalLink('متابعة: '+nm,(o.phone?'واتساب: '+waLink(o.phone,o.contact||nm)+'\n':'')+(o.note||''),o.followUp),'_blank');
  }
}
function del(sec,id){if(!confirm('متأكد إنك عايز تحذف؟'))return;db[sec]=db[sec].filter(function(x){return x.id!==id});save();render()}
function findItem(sec,id){
  if(sec==='plan'){var p=id.split('|'),c=co(p[0]);if(!c)return null;var s=(c.plan||[]).find(function(x){return x.id===p[1]});
    return s?{_step:s,_co:c}:null}
  return db[sec].find(function(x){return x.id===id})}
function doneFu(sec,id){var x=findItem(sec,id);if(!x)return;
  if(sec==='plan'){x._step.done=true;x._co.updated=Date.now();save();render();return}
  if(sec==='tasks')x.done=true;else{x.lastContact=new Date().toISOString();x.followUp=''}
  x.updated=Date.now();save();render();
  if(sec!=='tasks'&&confirm('تحدد ميعاد المتابعة الجاية دلوقتي؟'))openForm(sec,id);}
function snooze(sec,id){var x=findItem(sec,id);if(!x)return;
  var cur=sec==='plan'?x._step.due:x.followUp,d=new Date(cur),n=new Date();if(isNaN(d)||d<n)d=n;d.setDate(d.getDate()+1);
  if(sec==='plan')x._step.due=toLocalDT(d);else{x.followUp=toLocalDT(d);x.updated=Date.now()}save();render()}
function quickAdd(){
  if(tab==='company'){openForm('sales','',curCo);return}
  var m={sales:'sales',broker:'broker',money:'money',companies:'companies'}[tab]||(tab==='follow'?'tasks':null);
  if(m)openForm(m);else{document.getElementById('mbody').innerHTML='<h3 style="margin:0 0 10px;color:var(--navy)">تضيف إيه؟</h3><div class="list">'+
  '<button class="btn" onclick="openForm(\'companies\')">شركة (بخطة وعملاء)</button><button class="btn" onclick="openForm(\'sales\')">عميل مبيعات</button><button class="btn" onclick="openForm(\'broker\')">فندق / شركة سياحة / صفقة وساطة</button><button class="btn" onclick="openForm(\'money\')">حركة فلوس</button><button class="btn teal" onclick="openForm(\'tasks\')">مهمة متابعة</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div>';
  openM()}}
function exportJson(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='dr-crm-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function exportCsv(){var cols=['الشركة','الاسم','الرقم','المرحلة','القيمة','المصدر','المتابعة','ملاحظات'];
  var lines=[cols].concat(db.sales.map(function(x){return [coName(x.companyId)||x.company,x.name,x.phone,x.stage,x.value,x.source,x.followUp,x.note]}))
    .map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines],{type:'text/csv'}));a.download='dr-crm-clients.csv';a.click()}
function importJson(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);
  if(!confirm('الاستيراد هيستبدل كل الداتا الحالية بالنسخة دي. متأكد؟'))return;db=Object.assign(emptyDb(),d);save();render();alert('تم الاستيراد')}catch(e){alert('الملف مش صالح')}};r.readAsText(f)}
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeM()});
render();
initFirebase();
</script>
